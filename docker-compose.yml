version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: budgetapp
      MYSQL_USER: newuser
      MYSQL_PASSWORD: newpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    # Only if you want initialization scripts to run automatically:
    #   - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql

  app:
    build: .
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/budgetapp?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=newuser
      - SPRING_DATASOURCE_PASSWORD=newpassword
      # Let Spring update schema (for initial rapid dev matching local config)
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update 

volumes:
  db_data:
